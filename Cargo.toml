[workspace]
members = ["crates/tap-core", "crates/tap-sui", "crates/tap-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
bcs = "0.1.6"
blake2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
minicbor = { version = "0.26", features = ["std"] }
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "io-std"] }
pcsc = "=2.9.0"
sui-sdk-types = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", features = ["serde", "hash"] }
sui-crypto = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", features = ["ed25519"] }
sui-rpc = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5" }
sui-transaction-builder = { git = "https://github.com/MystenLabs/sui-rust-sdk", rev = "1313d5112464ecc25d7407f42442adea08589fc5", default-features = false }

[profile.release]
lto = "thin"
strip = "debuginfo"

