[package]
name = "tap-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linux-tap"
path = "src/main.rs"

[features]
default = []
pcsc-reader = ["dep:pcsc"]

[dependencies]
anyhow.workspace = true
bcs.workspace = true
clap.workspace = true
hex.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sui-crypto.workspace = true
sui-sdk-types.workspace = true
tap-core = { path = "../tap-core" }
tap-sui = { path = "../tap-sui" }
tokio.workspace = true
pcsc = { workspace = true, optional = true }

